<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body>
    <aside class="aaa">
      <img src="./eisenhower-matrix.jpg" alt="The eisenhower matrix">
      <a 
        class="more_inf" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </aside>
    <main class="centered-main-page-element">
      <section>
      <form id="topsectionforaddingelementtolist">
        <label for="new-task">Add Item</label>
        <div class="task-row-wrapper">
          <input 
            id="new-task"
            class="task" 
            type="text"
          >
          <button>Add</button>
        </div>
      </form>
      </section>
      <section>
      <h1>Todo</h1>
      <ul id="incompletetasks">
        <li>
          <article>
          <input type="checkbox">
          <label class="task">Pay Bills</label>
          <input type="text" class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="Delete button">
          </button>
          </article>
        </li>
        <li class="editmode">
          <article>
          <input type="checkbox">
          <label class="task">Go Shopping</label>
          <input 
            type="text" 
            value="Go Shopping" 
            class="task"
          >
          <button class="edit">Save</button>
          <button class="delete">
            <img src="./remove.svg" alt="Delete button">
          </button>
          </article>
        </li>
      </ul>
      </section>
      <section>
      <h2>Completed</h2>
      <ul id="completed-tasks">
        <li>
          <article>
          <input type="checkbox" checked>
          <label class="task">See the Doctor</label>
          <input type="text" class="task">
          <button class="edit">Edit</button>
          <button class="delete">
            <img src="./remove.svg" alt="Delete button">
          </button>
          </article>
        </li>
      </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>

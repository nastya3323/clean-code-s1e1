<!DOCTYPE html>
<html>
  <head>
    <title>Todo App</title>
    <link 
      href="https://fonts.googleapis.com/css?family=Lato:300,400,700" 
      rel="stylesheet"
    >
    <link 
      rel="stylesheet" 
      href="style.css" 
      media="screen" 
      charset="utf-8"
    >
  </head>
  <body>
    <aside class="aside">
      <img class="aside__img" src="./eisenhower-matrix.jpg" alt="The eisenhower matrix">
      <a 
        class="aside__link" 
        href="https://goal-life.com/page/method/matrix-eisenhower"
      >
        Want more details?
      </a>
    </aside>
    <main class="main">
      <section class="section">
        <form class="form" id="add-task">
          <label class="form__label" for="new-task">Add Item</label>
          <div class="form__inner">
            <input 
              class="form__new-task" 
              id="new-task"
              type="text"
            >
            <button class="form__btn button">Add</button>
          </div>
        </form>
      </section>
      <section class="section">
        <h1 class="section__title">Todo</h1>
        <ul class="section__list" id="incomplete-tasks">
          <li class="section__item">
            <article class="task">
              <input class="task__checkbox" type="checkbox">
              <label class="task__label">Pay Bills</label>
              <input class="task__title" type="text">
              <button class="task__edit-btn button">Edit</button>
              <button class="task__delete-btn button">
                <img class="task__img" src="./remove.svg" alt="Delete button">
              </button>
            </article>
          </li>
          <li class="section__item section__item_edit-mode">
            <article class="task">
              <input class="task__checkbox" type="checkbox">
              <label class="task__label">Go Shopping</label>
              <input 
                class="task__title"
                type="text" 
                value="Go Shopping" 
              >
              <button class="task__save-btn button">Save</button>
              <button class="task__delete-btn button">
                <img class="task__img" src="./remove.svg" alt="Delete button">
              </button>
            </article>
          </li>
        </ul>
      </section>
      <section class="section">
        <h2 class="section__title">Completed</h2>
        <ul class="section__list" id="completed-tasks">
          <li class="section__item">
            <article class="task">
              <input class="task__checkbox" type="checkbox" checked>
              <label class="task__label task__label_completed">See the Doctor</label>
              <input class="task__title" type="text">
              <button class="task__edit-btn button">Edit</button>
              <button class="task__delete-btn button">
                <img class="task__img" src="./remove.svg" alt="Delete button">
              </button>
            </article>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
